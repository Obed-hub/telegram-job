<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Matchmaker Preview</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0088cc">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/icon.png">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">JobMatch</div>
            <div class="header-actions">
                <button id="filterBtn" class="icon-btn">🔍</button>
            </div>
        </header>

        <main class="discovery">
            <div id="cardDeck" class="card-deck">
                <!-- Cards will be injected here by JS -->
                <div class="empty-state">
                    <p>Searching for more matches...</p>
                    <div class="loader"></div>
                </div>
            </div>

            <div class="controls">
                <button id="passBtn" class="control-btn pass">✕</button>
                <button id="applyBtn" class="control-btn apply">♥</button>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="discover">
                <span class="icon">🔥</span>
                <span class="label">Discover</span>
            </button>
            <button class="nav-item" data-tab="matches">
                <span class="icon">💬</span>
                <span class="label">Matches</span>
            </button>
            <button class="nav-item" data-tab="profile">
                <span class="icon">👤</span>
                <span class="label">Profile</span>
            </button>
        </nav>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js"
            }
        }
    </script>
    <script type="module">
        import { initializeApp } from "firebase/app";

        const firebaseConfig = {
            apiKey: "AIzaSyA8JRk3kIAQx1h7jxZavoRCrjT6eXXrO18",
            authDomain: "job-telegram.firebaseapp.com",
            projectId: "job-telegram",
            storageBucket: "job-telegram.firebasestorage.app",
            messagingSenderId: "703434244254",
            appId: "1:703434244254:web:9734b54ade3377702cbb8f"
        };

        const app = initializeApp(firebaseConfig);
    </script>
    <script src="script.js"></script>
</body>
</html>
